<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VaultUSD</title>
  <style>
    :root { --primary: #00d4ff; --bg: #0b0f19; --card: #151a28; --text: #e0e6ed; --accent: #00ff88; --danger: #ff4444; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: auto; }
    .auth-box, .dashboard { background: var(--card); padding: 25px; border-radius: 12px; margin-top: 20px; }
    input, button, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #333; background: #1a2030; color: white; border-radius: 8px; box-sizing: border-box; }
    button { background: var(--primary); color: #000; font-weight: bold; cursor: pointer; border: none; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .hidden { display: none !important; }
    #sysStatus { background: #111; border: 1px solid #444; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-family: monospace; font-size: 13px; color: #0f0; }
    #sysStatus.error { color: #f44; border-color: #f44; }
    h1 { text-align: center; color: var(--primary); margin: 0 0 15px; }
    .link { color: var(--primary); cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>VaultUSD</h1>
    <div id="sysStatus">🔄 جاري فحص الاتصال بـ Firebase...</div>

    <div id="loginSection" class="auth-box">
      <h2>تسجيل الدخول</h2>
      <input type="text" id="username" placeholder="اسم المستخدم">
      <input type="password" id="password" placeholder="كلمة المرور">
      <button id="loginBtn">دخول</button>
      <p style="text-align:center; margin-top:10px;"><span class="link" id="toReg">إنشاء حساب جديد</span></p>
    </div>

    <div id="registerSection" class="auth-box hidden">
      <h2>إنشاء حساب جديد</h2>
      <input type="text" id="regUser" placeholder="اسم المستخدم (إنجليزي بدون مسافات)">
      <input type="password" id="regPass" placeholder="كلمة المرور (6 أحرف على الأقل)">
      <button id="regBtn">تسجيل</button>
      <p style="text-align:center; margin-top:10px;"><span class="link" id="toLogin">العودة للدخول</span></p>
    </div>

    <div id="dashboardSection" class="dashboard hidden">
      <h2>تم الدخول بنجاح ✅</h2>
      <p>الرصيد: <span id="bal">$0.00</span></p>
      <button id="logoutBtn" style="background:var(--danger); margin-top:15px;">خروج</button>
    </div>
  </div>

  <script type="module">
    // فحص أخطاء الجافاسكربت الصامتة
    window.onerror = (msg, url, line) => {
      document.getElementById('sysStatus').textContent = `❌ خطأ JS: ${msg} (سطر ${line})`;
      document.getElementById('sysStatus').classList.add('error');
    };

    let auth, db;
    try {
      const { initializeApp } = await import("https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js");
      const { getAuth } = await import("https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js");
      const { getFirestore } = await import("https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js");
      
      const firebaseConfig = { 
        apiKey: "AIzaSyBEPY92lQXZHchrmPbmeNRjFG3FtkiN3a0", 
        authDomain: "vaultusd-c1998.firebaseapp.com", 
        projectId: "vaultusd-c1998", 
        storageBucket: "vaultusd-c1998.firebasestorage.app", 
        messagingSenderId: "627849430299", 
        appId: "1:627849430299:web:d5680cc24a21861f367fbe" 
      };
      const app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
      document.getElementById('sysStatus').textContent = "✅ Firebase متصل وجاهز";
    } catch (e) {
      document.getElementById('sysStatus').textContent = `❌ فشل تحميل Firebase: ${e.message}`;
      document.getElementById('sysStatus').classList.add('error');
    }

    const $ = id => document.getElementById(id);
    const toggle = view => {
      $('loginSection').classList.toggle('hidden', view !== 'login');
      $('registerSection').classList.toggle('hidden', view !== 'register');
      $('dashboardSection').classList.toggle('hidden', view !== 'dashboard');
    };

    $('regBtn').addEventListener('click', async () => {
      const u = $('regUser').value.trim(), p = $('regPass').value.trim();
      if (!u || !p) return alert('أدخل البيانات كاملة');
      if (!/^[a-zA-Z0-9_]+$/.test(u)) return alert('اسم المستخدم إنجليزي بدون مسافات');
      if (p.length < 6) return alert('كلمة المرور 6 أحرف على الأقل');
      $('regBtn').disabled = true; $('regBtn').textContent = 'جاري التسجيل...';
      try {
        const { createUserWithEmailAndPassword } = await import("https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js");
        const { setDoc, doc, serverTimestamp } = await import("https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js");
        const cred = await createUserWithEmailAndPassword(auth, `${u.toLowerCase()}@vaultusd.com`, p);
        await setDoc(doc(db, 'users', cred.user.uid), { username: u, balance: 0, createdAt: serverTimestamp() });
        alert('✅ تم إنشاء الحساب بنجاح. يمكنك الدخول الآن.');
        toggle('login');
      } catch (e) {
        const msg = e.code === 'auth/email-already-in-use' ? 'اسم المستخدم مستخدم مسبقاً' :
                    e.code === 'auth/operation-not-allowed' ? '❌ تفعيل المصادقة غير مكتمل في Firebase Console' :
                    e.message;
        alert(`❌ ${msg}`);
      } finally { $('regBtn').disabled = false; $('regBtn').textContent = 'تسجيل'; }
    });

    $('loginBtn').addEventListener('click', async () => {
      const u = $('username').value.trim(), p = $('password').value.trim();
      if (!u || !p) return alert('أدخل البيانات كاملة');
      $('loginBtn').disabled = true; $('loginBtn').textContent = 'جاري الدخول...';
      try {
        const { signInWithEmailAndPassword } = await import("https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js");
        await signInWithEmailAndPassword(auth, `${u.toLowerCase()}@vaultusd.com`, p);
      } catch (e) {
        const msg = e.code === 'auth/user-not-found' ? 'المستخدم غير مسجل. سجل أولاً.' :
                    e.code === 'auth/wrong-password' ? 'كلمة المرور خاطئة.' :
                    e.code === 'auth/operation-not-allowed' ? '❌ تفعيل المصادقة غير مكتمل في Firebase Console' :
                    e.message;
        alert(`❌ ${msg}`);
      } finally { $('loginBtn').disabled = false; $('loginBtn').textContent = 'دخول'; }
    });

    $('logoutBtn').addEventListener('click', async () => {
      const { signOut } = await import("https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js");
      await signOut(auth);
    });
    $('toReg').addEventListener('click', () => toggle('register'));
    $('toLogin').addEventListener('click', () => toggle('login'));

    const { onAuthStateChanged } = await import("https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js");
    onAuthStateChanged(auth, user => {
      if (user) {
        toggle('dashboard');
        $('bal').textContent = '$0.00 (تم الدخول)';
      } else {
        toggle('login');
      }
    });
  </script>
</body>
</html>
