<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VaultUSD</title>
  <style>
    :root { --primary: #00d4ff; --bg: #0b0f19; --card: #151a28; --text: #e0e6ed; --accent: #00ff88; --danger: #ff4444; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    .lang-bar { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
    .lang-btn { padding: 6px 12px; background: #1a2030; color: #aaa; border: 1px solid #333; border-radius: 6px; cursor: pointer; }
    .lang-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
    .container { max-width: 1000px; margin: auto; }
    .auth-box, .dashboard { background: var(--card); padding: 30px; border-radius: 12px; margin-top: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    input, button, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #333; background: #1a2030; color: white; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
    button { background: var(--primary); color: #000; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .hidden { display: none !important; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 15px; margin: 15px 0; }
    .card { background: #1a2030; padding: 15px; border-radius: 8px; border: 1px solid #333; }
    .card h3 { color: var(--primary); margin: 0 0 10px; }
    .copy-btn { background: #333; color: white; padding: 6px 12px; font-size: 13px; width: auto; display: inline-block; margin-top: 8px; }
    .notice { background: #2a1515; border: 1px solid #ff4444; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-weight: bold; }
    .profit { color: var(--accent); font-weight: bold; }
    a { color: var(--primary); text-decoration: none; cursor: pointer; }
    h2 { margin-top: 0; }
    .balance-box { background: #0f1520; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-size: 1.2em; border: 1px solid var(--primary); }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; color: #aaa; font-size: 13px; }
    .req { color: var(--danger); }
    .timers { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
    .timer-box { flex: 1; background: #111827; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #333; min-width: 140px; }
    .timer-box span { display: block; font-size: 12px; color: #888; margin-bottom: 4px; }
    .timer-box b { color: var(--accent); font-size: 16px; }
    .debug-box { background: #111; padding: 10px; border-radius: 6px; margin: 10px 0; font-family: monospace; font-size: 12px; color: #ff8888; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="lang-bar">
      <button class="lang-btn active" onclick="setLang('ar')">🇸🇦 عربي</button>
      <button class="lang-btn" onclick="setLang('en')">🇬🇧 EN</button>
      <button class="lang-btn" onclick="setLang('fr')">🇫🇷 FR</button>
    </div>
    <h1 style="text-align:center; color:var(--primary); letter-spacing: 2px;" data-i18n="siteTitle">VaultUSD</h1>

    <div id="loginSection" class="auth-box">
      <h2 data-i18n="login">تسجيل الدخول</h2>
      <input type="text" id="username" data-i18n-placeholder="usernamePH" placeholder="اسم المستخدم (إنجليزي بدون مسافات)">
      <input type="password" id="password" data-i18n-placeholder="passwordPH" placeholder="كلمة المرور (6 أحرف على الأقل)">
      <button id="loginBtn" data-i18n="loginBtn">دخول</button>
      <div id="loginDebug" class="debug-box"></div>
      <p style="text-align:center; margin-top:10px;"><span data-i18n="noAccount">ليس لديك حساب؟</span> <a id="toReg" data-i18n="registerLink">سجل الآن</a></p>
    </div>

    <div id="registerSection" class="auth-box hidden">
      <h2 data-i18n="register">إنشاء حساب جديد</h2>
      <input type="text" id="regUser" data-i18n-placeholder="usernamePH" placeholder="اسم المستخدم (إنجليزي بدون مسافات)">
      <input type="password" id="regPass" data-i18n-placeholder="passwordPH" placeholder="كلمة المرور (6 أحرف على الأقل)">
      <button id="regBtn" data-i18n="regBtn">تسجيل</button>
      <p style="text-align:center; margin-top:10px;"><a id="toLogin" data-i18n="backToLogin">العودة لتسجيل الدخول</a></p>
    </div>

    <div id="dashboardSection" class="dashboard hidden">
      <div class="notice" data-i18n="notice">⚠️ احفظ بيانات الدخول. لا يوجد استعادة للحسابات المفقودة.</div>
      <div class="balance-box"><span data-i18n="balanceLabel">الرصيد الحالي</span>: <span id="balanceDisplay">$0.00</span></div>
      <div class="timers hidden" id="timersContainer">
