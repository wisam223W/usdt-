<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VaultUSD</title>
  <style>
    :root { --primary: #00d4ff; --bg: #0b0f19; --card: #151a28; --text: #e0e6ed; --accent: #00ff88; --danger: #ff4444; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    .container { max-width: 1000px; margin: auto; }
    .auth-box, .dashboard { background: var(--card); padding: 30px; border-radius: 12px; margin-top: 20px; }
    input, button, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #333; background: #1a2030; color: white; border-radius: 8px; box-sizing: border-box; }
    button { background: var(--primary); color: #000; font-weight: bold; cursor: pointer; border: none; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .hidden { display: none !important; }
    .debug-panel { background: #000; border: 1px solid #444; padding: 10px; margin: 10px 0; border-radius: 6px; font-family: monospace; font-size: 12px; color: #0f0; max-height: 150px; overflow-y: auto; }
    .debug-panel.error { color: #f44; }
    .lang-bar { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
    .lang-btn { padding: 6px 12px; background: #1a2030; color: #aaa; border: 1px solid #333; border-radius: 6px; cursor: pointer; }
    .lang-btn.active { background: var(--primary); color: #000; }
  </style>
</head>
<body>
  <div class="container">
    <div class="lang-bar">
      <button class="lang-btn active" onclick="setLang('ar')">🇸🇦 عربي</button>
      <button class="lang-btn" onclick="setLang('en')">🇬🇧 EN</button>
    </div>
    <h1 style="text-align:center; color:var(--primary);">VaultUSD</h1>

    <div id="loginSection" class="auth-box">
      <h2>تسجيل الدخول</h2>
      <input type="text" id="username" placeholder="اسم المستخدم">
      <input type="password" id="password" placeholder="كلمة المرور">
      <button id="loginBtn">دخول</button>
      <div id="debugLog" class="debug-panel">جاهز للتشغيل...</div>
      <p style="text-align:center; margin-top:10px;"><a id="toReg" href="#">إنشاء حساب جديد</a></p>
    </div>

    <div id="dashboardSection" class="dashboard hidden">
      <h2>مرحباً! تم الدخول بنجاح.</h2>
      <p>الرصيد: <span id="balanceDisplay">$0.00</span></p>
      <button id="logoutBtn" style="background:var(--danger); margin-top:10px;">خروج</button>
    </div>
  </div>

  <script type="module">
    // نظام تسجيل مرئي مباشر
    const log = (msg, type = 'info') => {
      const box = document.getElementById('debugLog');
      box.textContent = `[${new Date().toLocaleTimeString()}] ${msg}\n` + box.textContent;
      if(type === 'error') box.classList.add('error');
      console.log(msg);
    };

    // استيراد Firebase بأمان
    let auth, db;
    try {
      const { initializeApp } = await import("https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js");
      const { getAuth } = await import("https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js");
      const { getFirestore } = await import("https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js");
      
      const firebaseConfig = { 
        apiKey: "AIzaSyBEPY92lQXZHchrmPbmeNRjFG3FtkiN3a0", 
        authDomain: "vaultusd-c1998.firebaseapp.com", 
        projectId: "vaultusd-c1998", 
        storageBucket: "vaultusd-c1998.firebasestorage.app", 
        messagingSenderId: "627849430299", 
        appId: "1:627849430299:web:d5680cc24a21861f367fbe" 
      };
      
      const app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
      log("✅ Firebase تم تحميله بنجاح");
    } catch (err) {
      log("❌ فشل تحميل Firebase: " + err.message, 'error');
    }

    // ربط الأحداث بعد تحميل الصفحة
    document.addEventListener('DOMContentLoaded', () => {
      const loginBtn = document.getElementById('loginBtn');
      if(!loginBtn) { log("❌ زر الدخول غير موجود في HTML", 'error'); return; }
      
      loginBtn.addEventListener('click', async () => {
        log("👆 تم الضغط على زر الدخول");
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value.trim();
        
        if(!u || !p) { log("⚠️ الحقول فارغة", 'error'); return; }
        loginBtn.disabled = true; loginBtn.textContent = "جاري الدخول...";
        
        try {
          const { signInWithEmailAndPassword } = await import("https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js");
          const email = `${u.toLowerCase()}@vaultusd.com`;
          log(`🔑 محاولة الدخول بـ: ${email}`);
          
          await signInWithEmailAndPassword(auth, email, p);
          log("✅ تم تسجيل الدخول بنجاح");
          document.getElementById('loginSection').classList.add('hidden');
          document.getElementById('dashboardSection').classList.remove('hidden');
        } catch (err) {
          log(`❌ خطأ: ${err.code || err.message}`, 'error');
        } finally {
          loginBtn.disabled = false; loginBtn.textContent = "دخول";
        }
      });

      document.getElementById('toReg').addEventListener('click', (e) => {
        e.preventDefault(); log("🔗 الانتقال لصفحة التسجيل (قيد التطوير)");
      });
      
      document.getElementById('logoutBtn').addEventListener('click', async () => {
        const { signOut } = await import("https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js");
        await signOut(auth);
        document.getElementById('dashboardSection').classList.add('hidden');
        document.getElementById('loginSection').classList.remove('hidden');
        log("🚪 تم تسجيل الخروج");
      });
    });
  </script>
</body>
</html>
