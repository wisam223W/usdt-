<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VaultUSD</title>
  <style>
    :root { --primary: #00d4ff; --bg: #0b0f19; --card: #151a28; --text: #e0e6ed; --accent: #00ff88; --danger: #ff4444; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    .container { max-width: 1000px; margin: auto; }
    .auth-box, .dashboard { background: var(--card); padding: 30px; border-radius: 12px; margin-top: 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    input, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #333; background: #1a2030; color: white; border-radius: 8px; box-sizing: border-box; }
    button { background: var(--primary); color: #000; font-weight: bold; cursor: pointer; border: none; }
    button:hover { opacity: 0.9; }
    .hidden { display: none !important; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 15px; margin: 15px 0; }
    .card { background: #1a2030; padding: 15px; border-radius: 8px; border: 1px solid #333; }
    .card h3 { color: var(--primary); margin: 0 0 10px; }
    .copy-btn { background: #333; color: white; padding: 6px 12px; font-size: 13px; width: auto; display: inline-block; margin-top: 8px; }
    .notice { background: #2a1515; border: 1px solid #ff4444; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-weight: bold; }
    .profit { color: var(--accent); font-weight: bold; }
    a { color: var(--primary); text-decoration: none; }
    h2 { margin-top: 0; }
    .balance-box { background: #0f1520; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-size: 1.2em; border: 1px solid var(--primary); }
  </style>
</head>
<body>
  <div class="container">
    <h1 style="text-align:center; color:var(--primary); letter-spacing: 2px;">VaultUSD</h1>

    <div id="loginSection" class="auth-box">
      <h2>تسجيل الدخول</h2>
      <input type="text" id="username" placeholder="اسم المستخدم">
      <input type="password" id="password" placeholder="كلمة المرور">
      <button id="loginBtn">دخول</button>
      <p style="text-align:center; margin-top:10px;">ليس لديك حساب؟ <a href="#" id="toReg">سجل الآن</a></p>
    </div>

    <div id="registerSection" class="auth-box hidden">
      <h2>إنشاء حساب جديد</h2>
      <input type="text" id="regUser" placeholder="اسم المستخدم">
      <input type="password" id="regPass" placeholder="كلمة المرور">
      <button id="regBtn">تسجيل</button>
      <p style="text-align:center; margin-top:10px;"><a href="#" id="toLogin">العودة لتسجيل الدخول</a></p>
    </div>

    <div id="dashboardSection" class="dashboard hidden">
      <div class="notice">⚠️ تنبيه هام: يرجى حفظ اسم المستخدم وكلمة المرور في مكان آمن. النظام لا يدعم استعادة الحسابات المفقودة.</div>
      <div class="balance-box">الرصيد الحالي: <span id="balanceDisplay">$0.00</span></div>
      
      <h3>📦 الباقات الاستثمارية</h3>
      <div class="grid" id="packagesGrid"></div>

      <h3>💳 عناوين الإيداع (USDT)</h3>
      <div class="grid" id="networksGrid"></div>

      <h3>💸 طلب سحب</h3>
      <input type="number" id="withdrawAmt" placeholder="المبلغ (الحد الأدنى 50$)">
      <input type="text" id="withdrawAddr" placeholder="عنوان محفظتك للسحب">
      <button id="withdrawBtn">إرسال طلب السحب</button>
      <button id="logoutBtn" style="background:var(--danger); margin-top:10px;">تسجيل خروج</button>
    </div>
  </div>

      const userRef = doc(db, 'users', user.uid);
      await updateDoc(userRef, {
        activePackage: pkgId,
        balance: increment(price),
        lastUpdated: serverTimestamp()
      });
      alert(`تم تفعيل ${pkgId} بنجاح. سيتم احتساب الأرباح يومياً.`);
      loadUserData(user.uid);
    };

      if(snap.exists()) {
        const data = snap.data();
        $('balanceDisplay').textContent = `$${data.balance || 0}`;
      }
    };
